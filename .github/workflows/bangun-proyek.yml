name: Bangun Proyek
# Dijalankan otomatis oleh aplikasi Pembuat Aplikasi (menu: Bangun proyek).
# File ini harus berada di .github/workflows/ pada ROOT repo GitHub Anda.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Nama folder proyek di proyek/ (sama dengan nama paket)"
        required: true
      keamanan:
        description: "Enkripsi keamanan aplikasi (ya = skrip Lua hasil build dienkripsi; tidak = tidak dienkripsi)"
        required: false
        default: "ya"

jobs:
  bangun:
    name: Bangun APK
    runs-on: ubuntu-latest
    env:
      SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Pasang platform, build-tools dan NDK
        run: |
          # SDK sudah terpasang di runner ubuntu-latest (ANDROID_HOME)
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.0.8775105"

      - name: Ekstrak mesin build
        run: |
          if [ -f mesin/engine.zip ]; then unzip -q -o mesin/engine.zip -d .; fi

      - name: Cari folder proyek Gradle
        run: |
          DIR=$(dirname "$(find . -name settings.gradle -not -path './proyek/*' -not -path '*/node_modules/*' | sort | head -n1)")
          echo "Folder Gradle: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Siapkan proyek (nama, versi, SDK, izin, skrip)
        env:
          PACK_KEAMANAN: ${{ inputs.keamanan }}
        run: python3 "$PROJECT_DIR/tools/pack.py" "$SLUG" "$PROJECT_DIR" "$GITHUB_WORKSPACE"

      - name: Kompilasi APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SKIP_ENGINE_ZIP: "1"
        run: gradle :app:assembleDebug --no-daemon

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.slug }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
